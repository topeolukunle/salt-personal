version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - cd infrastructure/sam/amplify-app && npm install
    build:
      commands:
        - cd infrastructure/sam/amplify-app && npm run build
  artifacts:
    baseDirectory: infrastructure/sam/amplify-app/build
    files:
      - '**/*'
  cache:
    paths:
      - infrastructure/sam/amplify-app/node_modules/**/*
